# Gemstone policy configuration.
#
#   exclude <glob>   never build or install packages whose name matches (fnmatch)

# JadeOS uses OpenRC. Packages for other init systems and service managers
# are never selected, not even as providers of virtual packages such as
# init-rc or svc-manager.
exclude dinit
exclude dinit-*
exclude *-dinit
exclude runit
exclude runit-*
exclude *-runit
exclude s6
exclude s6-*
exclude *-s6
exclude suite66
exclude suite66-*
exclude *-suite66

# JadeOS uses uutils (package uutils-coreutils, which provides coreutils)
# instead of GNU coreutils.
exclude coreutils
