; JadeOS default panel. To customize it, copy this file to
; ~/.config/polybar/config.ini; jadeos-panel then uses your copy.

[colors]
background = #e60b1f17
background-alt = #0f2a20
foreground = #d6efe4
primary = #00a86b
accent = #7dffc4
muted = #5f8a78

[bar/jadeos]
width = 100%
height = 26
background = ${colors.background}
foreground = ${colors.foreground}
line-size = 2
border-bottom-size = 2
border-bottom-color = ${colors.primary}
padding-left = 1
padding-right = 1
module-margin = 1
separator = |
separator-foreground = ${colors.muted}
font-0 = DejaVu Sans:size=10;2
font-1 = DejaVu Sans Mono:size=10;2
modules-left = menu xworkspaces xwindow
modules-right = cpu memory wired wireless date tray
cursor-click = pointer
enable-ipc = true

[module/menu]
type = custom/text
format = JadeOS
format-foreground = ${colors.background}
format-background = ${colors.primary}
format-padding = 1
click-left = jadeos-launcher

[module/xworkspaces]
type = internal/xworkspaces
label-active = %name%
label-active-background = ${colors.background-alt}
label-active-underline = ${colors.primary}
label-active-padding = 1
label-occupied = %name%
label-occupied-padding = 1
label-urgent = %name%
label-urgent-background = ${colors.accent}
label-urgent-foreground = ${colors.background}
label-urgent-padding = 1
label-empty = %name%
label-empty-foreground = ${colors.muted}
label-empty-padding = 1

[module/xwindow]
type = internal/xwindow
label = %title:0:60:...%

[module/cpu]
type = internal/cpu
interval = 2
format-prefix = "CPU "
format-prefix-foreground = ${colors.primary}
label = %percentage:2%%

[module/memory]
type = internal/memory
interval = 2
format-prefix = "RAM "
format-prefix-foreground = ${colors.primary}
label = %percentage_used:2%%

[module/wired]
type = internal/network
interface-type = wired
interval = 5
format-connected-prefix = "NET "
format-connected-prefix-foreground = ${colors.primary}
label-connected = %{A1:jadeos-wifi --menu &:}%local_ip%%{A}
label-disconnected =

[module/wireless]
type = internal/network
interface-type = wireless
interval = 5
format-connected-prefix = "WIFI "
format-connected-prefix-foreground = ${colors.primary}
label-connected = %{A1:jadeos-wifi --menu &:}%essid%%{A}
label-disconnected =

[module/date]
type = internal/date
interval = 1
date = %a %d %b
time = %H:%M
label = %date%  %time%
label-foreground = ${colors.accent}

[module/tray]
type = internal/tray
tray-spacing = 6px

[settings]
screenchange-reload = true
