# Limine reads only FAT, so the kernels live on a FAT32 /boot partition.
# On UEFI systems the EFI system partition is mounted at /boot/efi.
# The JadeOS initramfs does not support LUKS or LVM yet; they are not offered.
---
efi:
    mountPoint:         "/boot/efi"
    recommendedSize:    300MiB
    minimumSize:        32MiB
    label:              "EFI"

userSwapChoices:
    - none
    - small
    - file

luksGeneration: luks1
enableLuksAutomatedPartitioning: false
drawNestedPartitions:   false
alwaysShowPartitionLabels: true
allowManualPartitioning: true
initialPartitioningChoice: none
initialSwapChoice: none

defaultFileSystemType:  "ext4"
availableFileSystemTypes:  ["ext4", "xfs"]

partitionLayout:
    - name: "JADEOS_BOOT"
      filesystem: "fat32"
      mountPoint: "/boot"
      size: 1GiB
    - name: "JadeOS"
      filesystem: "unknown"
      mountPoint: "/"
      minSize: 10GiB
      size: 100%

lvm:
    enable: false

essentialMounts: [ "live-*", "control", "ventoy" ]
