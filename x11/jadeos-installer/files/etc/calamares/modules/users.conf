---
defaultGroups:
    - name: users
      must_exist: true
      system: true
    - name: wheel
      must_exist: false
      system: true
    - audio
    - video
    - input
    - storage
    - network
    - name: autologin
      must_exist: false
      system: true

# No sudoers file: JadeOS uses doas, and /etc/doas.conf lets the wheel
# group (above) run commands as root.
autologinGroup:  autologin
setRootPassword: true
doReusePassword: false
displayAutologin: true
doAutologin:     false
user:
    shell: /usr/bin/bash
    forbidden_names: [ root ]

passwordRequirements:
    minLength: 1

allowWeakPasswords: true
allowWeakPasswordsDefault: false

hostname:
    location: EtcFile
    writeHostsFile: true
    template: "${first}-jadeos"
    forbidden_names: [ localhost ]
