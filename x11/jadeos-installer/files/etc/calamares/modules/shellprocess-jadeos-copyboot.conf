# unpackfs skips /boot (FAT on the target). Copy the files that packages
# own in /boot, other than the kernel and initramfs (recreated by
# jo-mkinitramfs), from the live system.
---
dontChroot: true
timeout: 120
script:
    - "cp /run/live/rootfs/boot/amd-ucode.img /run/live/rootfs/boot/intel-ucode.img ${ROOT}/boot/"
