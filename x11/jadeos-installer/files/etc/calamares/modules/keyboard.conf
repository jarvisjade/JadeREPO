# The console keymap is copied from /etc/vconsole.conf to OpenRC's
# /etc/conf.d/keymaps by the jadeos-post step.
---
xOrgConfFileName:       "/etc/X11/xorg.conf.d/00-keyboard.conf"
convertedKeymapPath:    "/usr/share/kbd/keymaps/xkb"
writeEtcDefaultKeyboard: false
configure:
    kwin: false
    gnome: false
