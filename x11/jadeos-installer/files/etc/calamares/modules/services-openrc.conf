# Services of the installed system. The image already enables them; this
# keeps the installed system correct if the image changes.
---
initdDir: /etc/init.d
runlevelsDir: /etc/runlevels
services:
    - name: dbus
      runlevel: default
      mandatory: false
    - name: elogind
      runlevel: boot
      mandatory: false
    - name: dhcpcd
      runlevel: default
      mandatory: false
    - name: iwd
      runlevel: default
      mandatory: false
    - name: lightdm
      runlevel: default
      mandatory: false
disable: []
