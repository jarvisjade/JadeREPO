# Calamares settings for the JadeOS installer.
#
# The installer copies the live system (live/jadeos.sfs) to the target,
# removes the live session configuration, then creates the initramfs and
# installs Limine (jo-limine). Writing to disk only starts after the user
# confirms the summary (prompt-install).
---
modules-search: [ local ]

instances:
- id:       jadeos-post
  module:   shellprocess
  config:   shellprocess-jadeos-post.conf
- id:       jadeos-copyboot
  module:   shellprocess
  config:   shellprocess-jadeos-copyboot.conf
- id:       jadeos-boot
  module:   shellprocess
  config:   shellprocess-jadeos-boot.conf

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - partition
  - users
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - fstab
  - locale
  - keyboard
  - localecfg
  - removeuser
  - users
  - displaymanager
  - hwclock
  - services-openrc
  - shellprocess@jadeos-post
  - shellprocess@jadeos-copyboot
  - shellprocess@jadeos-boot
  - umount
- show:
  - finished

branding: jadeos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: true
quit-at-end: false
